<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Unwrap</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header class="site-header">
            <a class="logo" href="index.html" aria-label="Unwrap home">
            <img src="images/unwrap-logo.svg" alt="Unwrap">
            </a>
        </header>

        <main>
            <h1>Your Statistics</h1>
            
            <section class="statistics-container">
                <section class="statistics-card" id="tracked-songs-card">
                    <h2>Tracked Songs</h2>
                    <p id="tracked-songs-value">77,345</p>
                </section>

                <section class="statistics-card" id="top-artist-card">
                    <h2>Top Artist</h2>
                    <p id="top-artist-value">Example Artist</p>
                </section>

                <section class="statistics-card" id="top-genre-card">
                    <h2>Top Genre</h2>
                    <p id="top-genre-value">Pop</p>
                </section>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Unwrap</p>
        </footer>
    </body>
</html>

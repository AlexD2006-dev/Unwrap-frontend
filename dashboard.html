<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Unwrap Statistics</title>

    <link rel="stylesheet" href="styles.css">
    <script type="module" src="dashboard.js" defer></script>
</head>

<body>
    <section class="top-panel" aria-labelledby="statistics-heading">
        <header class="site-header">
            <a class="logo" href="index.html" aria-label="Unwrap home">
                <img src="images/unwrap-logo.svg" alt="Unwrap">
            </a>
        </header>

        <div class="hero-content">
            <h1 id="statistics-heading">Your Statistics</h1>
        </div>
    </section>

    <main>
        <section
            class="statistics-panel"
            aria-label="Your listening statistics"
        >
            <section class="statistics-card" id="top-artist-card">
                <h2>Top 3 Artists</h2>
                <ol id="top-artist-value" aria-live="polite">
                    <li>Loading...</li>
                </ol>
            </section>

            <section class="statistics-card" id="top-track-card">
                <h2>Top 3 Songs</h2>
                <ol id="top-track-value" aria-live="polite">
                    <li>Loading...</li>
                </ol>
            </section>

            <section class="statistics-card" id="time-listened-card">
                <h2>Total Listening Time</h2>
                <p id="total-time-value" aria-live="polite">
                    Loading...
                </p>
            </section>

            <div class="dashboard-actions">
                <button
                    id="refresh-statistics-button"
                    class="refresh-button"
                    type="button"
                >
                    Refresh statistics
                </button>

                <p
                    id="refresh-message"
                    aria-live="polite"
                ></p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Unwrap</p>
    </footer>
</body>
</html>
